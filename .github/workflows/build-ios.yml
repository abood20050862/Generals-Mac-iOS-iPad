name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch missing scripts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/ammaarreshi/Generals-Mac.git /tmp/upstream
          cp -r /tmp/upstream/scripts .
          rm -rf /tmp/upstream

      - name: Install tools
        run: brew install cmake ninja meson pkg-config xcodegen

      - name: Fetch deps
        run: |
          ./scripts/build/ios/fetch-moltenvk
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure
        run: cmake --preset ios-vulkan -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO

      - name: Build
        run: cmake --build build/ios-vulkan --config Release

      - name: Package
        run: |
          mkdir -p Payload
          APP=$(find build/ios-vulkan -name "*.app" -maxdepth 3 | head -1)
          cp -R "$APP" Payload/
          zip -r GeneralsZH.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GeneralsZH-ipa
          path: GeneralsZH.ipa
