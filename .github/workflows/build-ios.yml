name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install dependencies
        run: |
          brew install cmake ninja meson pkg-config xcodegen

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
          ~/vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV

      - name: Setup Vulkan SDK
        run: |
          curl -LO https://sdk.lunarg.com/sdk/download/latest/mac/vulkan-sdk.dmg
          hdiutil attach vulkan-sdk.dmg
          sudo /Volumes/vulkansdk-macos-*/InstallVulkan.app/Contents/MacOS/InstallVulkan \
            --root ~/VulkanSDK --accept-licenses --default-answer --confirm-command install
          hdiutil detach /Volumes/vulkansdk-macos-*
          echo "VULKAN_SDK=$HOME/VulkanSDK/macOS" >> $GITHUB_ENV

      - name: Fetch MoltenVK
        run: ./scripts/build/ios/fetch-moltenvk.sh

      - name: Stage fonts
        run: ./scripts/build/ios/stage-fonts.sh

      - name: CMake configure
        run: |
          export PATH="$(brew --prefix)/bin:$PATH"
          cmake --preset ios-vulkan

      - name: CMake build
        run: cmake --build build/ios-vulkan --target GeneralsZH

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios-vulkan/GeneralsZH.app Payload/
          zip -r GeneralsZH-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsZH-unsigned
          path: GeneralsZH-unsigned.ipa
          retention-days: 7
